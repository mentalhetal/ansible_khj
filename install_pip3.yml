- name: Ensure passlib is installed
  hosts: all
  become: yes
  tasks:
    - name: Install pip3
      apt:
        name: python3-pip
        state: present
      when: ansible_os_family == "Debian"

    - name: Install pip3 (RHEL-based)
      yum:
        name: python3-pip
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install passlib via pip3
      pip:
        name: passlib
        state: present
        executable: /usr/bin/pip3
